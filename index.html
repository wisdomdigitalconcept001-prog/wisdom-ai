<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wisdom AI</title><style>
:root{--bg:#080808;--p:#151515;--line:#292929;--gold:#c8b17a;--text:#f5f5f3;--muted:#929292}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{height:100dvh;display:flex;flex-direction:column}.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px}.logo{font-weight:800;letter-spacing:.05em}.round{border:0;background:#1b1b1b;color:#ddd;border-radius:50%;width:38px;height:38px}.chat{flex:1;overflow:auto;padding:20px 13px 110px;max-width:760px;width:100%;margin:auto}.welcome{text-align:center;margin-top:18vh}.welcome h1{font-size:32px;margin:0 0 8px}.welcome p{color:var(--muted);font-size:14px}.msg{font-size:14px;color:#ddd;margin:12px 0}.result img{width:100%;border-radius:16px;border:1px solid var(--line);display:block}.actions{display:flex;gap:8px;margin-top:8px}.action{border:1px solid #303030;background:#151515;color:#eee;border-radius:11px;padding:9px 12px}.composer{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,var(--bg) 20%);padding:18px 12px 10px}.box{max-width:760px;margin:auto;background:var(--p);border:1px solid #303030;border-radius:22px;padding:7px;display:flex;align-items:flex-end;gap:7px}.box textarea{flex:1;min-height:43px;max-height:130px;background:transparent;color:#fff;border:0;outline:0;resize:none;padding:10px;font-size:15px}.send{background:var(--gold);color:#111}.meta{text-align:center;color:#777;font-size:11px;margin-top:5px}.status{text-align:center;color:#999;font-size:12px;min-height:18px}.desktop{display:none}@media(min-width:721px){.app{width:430px;height:900px;border:1px solid #292929;border-radius:28px;overflow:hidden}.desktop{display:block;text-align:center;color:#777;font-size:11px}}
</style></head><body><div class="app">
<header class="top"><button class="round" onclick="newChat()">＋</button><div class="logo">WISDOM AI</div><button class="round" onclick="speak('Wisdom AI is ready.')">🔊</button></header>
<main class="chat" id="chat"><section class="welcome" id="welcome"><h1>What can I design?</h1><p>Describe your flyer, poster, ad or social graphic.</p></section><div id="messages"></div><div id="status" class="status"></div></main>
<div class="composer"><div class="box"><button class="round" onclick="voice()">🎙</button><textarea id="prompt" placeholder="Describe your design…"></textarea><button class="round send" onclick="generate()">↑</button></div><div class="meta"><span onclick="cycle()">Format <b id="format">4:5</b></span> · <span onclick="provider()">AI <b id="ai">Open Source</b></span></div><div class="desktop">Open Wisdom AI on a phone to use it.</div></div></div>
<script>
let fmt="4:5",prov="open-source",img="";
const $=x=>document.getElementById(x);
function newChat(){$("messages").innerHTML="";$("welcome").style.display="block";$("prompt").value="";$("status").textContent=""}
function cycle(){fmt=fmt==="4:5"?"1:1":fmt==="1:1"?"9:16":"4:5";$("format").textContent=fmt}
function provider(){prov=prov==="open-source"?"openai":"open-source";$("ai").textContent=prov==="openai"?"OpenAI":"Open Source"}
function speak(t){if("speechSynthesis"in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}
function voice(){const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S)return alert("Voice input needs Chrome or a supported mobile browser.");let r=new S();r.lang="en-NG";r.onstart=()=>status("Listening…");r.onresult=e=>{$("prompt").value=e.results[0][0].transcript;status("")};r.onerror=()=>status("Voice input stopped.");r.start()}
function status(t){$("status").textContent=t}
async function generate(){let p=$("prompt").value.trim();if(!p)return status("Tell me what you want to design.");$("welcome").style.display="none";status("Creating your design…");$("messages").innerHTML+=`<div class="msg">You: ${esc(p)}</div>`;try{let r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:p,format:fmt,provider:prov})}),d=await r.json();if(!r.ok)throw Error(d.error||"Generation failed");img=d.image;$("messages").innerHTML+=`<div class="result"><img src="${d.image}"><div class="actions"><button class="action" onclick="download()">⬇ Download</button><button class="action" onclick="speak('Your design is ready.')">🔊 Talk back</button></div></div>`;$("prompt").value="";status("");speak("Your design is ready.");$("chat").scrollTop=$("chat").scrollHeight}catch(e){status(e.message);speak("The design could not be generated.")}}
function download(){let a=document.createElement("a");a.href=img;a.download="wisdom-ai-design.png";a.click()}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script></body></html>
